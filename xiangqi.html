<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b2118">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>象棋 · 人机 / 手动对弈</title>
<style>
  :root { --wood:#e9c68f; --line:#7a5230; --red:#b03028; --black:#23303f; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  html, body { touch-action: manipulation; }
  body { margin:0; font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#2b2118;
         color:#f0e6d2; display:flex; gap:24px; justify-content:center; padding:24px; flex-wrap:wrap;
         min-height:100vh; min-height:100dvh; overflow-x:hidden; overflow-y:auto;
         -webkit-overflow-scrolling:touch; overscroll-behavior-y:auto; }
  .board { position:relative; width:544px; height:602px; background:var(--wood);
           border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.5);
           cursor:pointer; user-select:none; }
  .boardWrap { width:544px; height:602px; }
  .board { transform-origin:top left; }
  @media (max-width:960px) {
    body { display:block; padding:12px; }
    .boardWrap { width:calc(544px * var(--bs,1)); height:calc(602px * var(--bs,1)); }
    .board { transform:scale(var(--bs,1)); }
    .panel { width:100%; max-width:100%; margin-top:14px; padding:14px; }
    .log { height:200px; }
    .rv { font-size:16px; }
  }
  .board svg { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  .layer { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  .piece { position:absolute; width:50px; height:50px; margin-left:-25px; margin-top:-25px;
           border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff8e6, #e8c87f 65%, #c9a25a);
           border:2px solid #8a6a3a; display:flex; align-items:center; justify-content:center;
           font-size:27px; font-weight:700; box-shadow:0 2px 5px rgba(0,0,0,.35); pointer-events:none; }
  .piece.r { color:var(--red); }
  .piece.b { color:var(--black); }
  .piece.sel { outline:3px solid #ffd54f; outline-offset:2px; }
  .dot { position:absolute; width:16px; height:16px; margin-left:-8px; margin-top:-8px; border-radius:50%;
         background:rgba(46,204,113,.75); pointer-events:none; }
  .ring { position:absolute; width:52px; height:52px; margin-left:-26px; margin-top:-26px; border-radius:50%;
          border:3px solid rgba(231,76,60,.85); pointer-events:none; }
  .rv { position:absolute; color:#8a5a2e; font-size:19px; letter-spacing:9px; opacity:.85; white-space:nowrap; }
  .panel { width:330px; background:#3a2c1f; border-radius:10px; padding:16px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { font-size:19px; margin:0 0 12px; }
  .status { font-size:15px; padding:10px 12px; background:#241a12; border-radius:8px; margin-bottom:12px; min-height:44px; }
  .score { font-weight:600; }
  .score.ok { color:#6fbf73; }
  .score.warn { color:#d9a441; }
  .score.bad { color:#d05c5c; }
  .detail { color:#8a7f6a; font-size:12px; }
  .detail b { color:#e8c87f; font-weight:600; }
  .status b { color:#ffd54f; }
  .evalbar { position:relative; display:flex; height:22px; border-radius:6px; overflow:hidden; margin:-4px 0 12px; background:#241a12; border:1px solid #3a2e22; }
  .evalbar-red { background:#a93226; width:50%; transition:width .25s ease; }
  .evalbar-black { background:#2c3e50; flex:1; }
  .evalbar-label { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#f0e6d2; text-shadow:0 1px 2px #000; pointer-events:none; }
  .row { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  button, select { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid #6b4f33;
                   background:#4a3728; color:#f0e6d2; cursor:pointer; }
  button:hover { background:#5b4432; }
  button.primary { background:#8e5b2e; border-color:#a9713c; }
  label { font-size:13px; opacity:.85; display:flex; align-items:center; gap:6px; }
  .log { margin-top:8px; background:#241a12; border-radius:8px; padding:8px; height:290px; overflow:auto;
         font-size:13px; line-height:1.7; font-family:Consolas,monospace; white-space:pre-wrap; }
  .hint { font-size:12px; opacity:.7; line-height:1.6; margin-top:8px; }
  .safety-mark { position:absolute; width:54px; height:54px; margin-left:-27px; margin-top:-27px;
                 border-radius:50%; pointer-events:none; }
  .safety-danger { border:3px solid rgba(231,76,60,.95); box-shadow:0 0 12px rgba(231,76,60,.55); }
  .safety-warn { border:3px dashed rgba(217,164,65,.95); }
  .threat-mark { border:3px dotted rgba(231,76,60,.9); }
  #safetyHint .danger { color:#ff8a80; }
  #safetyHint .warn { color:#e8c87f; }
  #materialHint .mat-red { color:#ff6b6b; }
  #materialHint .mat-black { color:#111; background:#e6d8b8; border-radius:4px; padding:0 4px; }

  .piece.moved { box-shadow:0 0 0 3px #ffd54f, 0 0 20px 5px rgba(255,213,79,.8); z-index:6;
                 animation:pulse .42s ease-out 2; }
  @keyframes pulse { 0%{transform:scale(1)} 40%{transform:scale(1.16)} 100%{transform:scale(1)} }
  .from-mark { position:absolute; width:54px; height:54px; margin-left:-27px; margin-top:-27px;
               border-radius:50%; border:3px dashed rgba(176,48,40,.6); pointer-events:none; }
  .to-mark { position:absolute; width:60px; height:60px; margin-left:-30px; margin-top:-30px;
             border-radius:10px; border:3px solid rgba(255,213,79,.95);
             box-shadow:0 0 16px rgba(255,213,79,.75); pointer-events:none; }
  .trail { position:absolute; height:6px; transform-origin:0 50%; border-radius:3px; pointer-events:none;
           background:linear-gradient(90deg, rgba(255,213,79,.10), rgba(255,213,79,.55));
           box-shadow:0 0 8px rgba(255,213,79,.35); }
  @media (max-height:560px) and (max-width:1000px) {
    body { padding:8px; gap:10px; }
    h1 { font-size:16px; margin-bottom:6px; }
    .panel { padding:10px; }
    .status { min-height:36px; padding:8px 10px; margin-bottom:8px; }
    .evalbar { margin-bottom:8px; }
    .row { margin-bottom:8px; }
    .log { height:150px; }
  }
</style>
</head>
<body>
<div class="boardWrap" id="boardWrap">
<div class="board" id="board">
  <svg id="lines" viewBox="0 0 544 602" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="layer" id="pieces"></div>
  <div class="layer" id="marks"></div>
</div>
</div>
<div class="panel">
  <h1>中国象棋</h1>
  <div class="status" id="status">红方先行</div>
  <div class="hint" id="materialHint"></div>
  <div class="evalbar"><div class="evalbar-red" id="evalBarRed"></div><div class="evalbar-black"></div><div class="evalbar-label" id="evalBarLabel">均势</div></div>
  <div class="row">
    <button class="primary" id="btnNew">重新开始</button>
    <button id="btnUndo">撤销</button>
  </div>
  <div class="row">
    <label>模式
      <select id="mode">
        <option value="ai">人机对战（黑方电脑）</option>
        <option value="manual">手动双人（和聊天里的对手下）</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label>电脑强度
      <select id="depth">
        <option value="2">简单（2 层）</option>
        <option value="3" selected>中等（3 层）</option>
        <option value="4">较强（4 层，约 1.5 秒）</option>
        <option value="5">强（5 层，约 2.5 秒）</option>
        <option value="6">很强（6 层，约 4 秒）</option>
      </select>
    </label>
  </div>

  <div class="row">
    <button id="btnCopy">复制棋谱</button>
    <button id="btnSave">导出 FEN</button>
    <button id="btnLoad">载入棋谱</button>
  </div>
  <div class="log" id="log">（棋谱会显示在这里）</div>
</div>
<script>
(function (global) {
  "use strict";
  // 棋盘 9 列 x 10 行，index = y*9 + x；y=0 顶部（黑），y=9 底部（红）
  const W = 9, H = 10;
  const RED = "r", BLACK = "b";
  const START = [
    "rnbakabnr",
    "         ",
    " c     c ",
    "p p p p p",
    "         ",
    "         ",
    "P P P P P",
    " C     C ",
    "         ",
    "RNBAKABNR"
  ];
  const CH = { r: { K: "帅", A: "仕", B: "相", N: "马", R: "车", C: "炮", P: "兵" },
               b: { K: "将", A: "士", B: "象", N: "马", R: "车", C: "炮", P: "卒" } };

  function newBoard() {
    const b = new Array(90).fill(null);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const ch = START[y][x];
      if (ch === " ") continue;
      const side = ch === ch.toUpperCase() ? RED : BLACK;
      b[y * W + x] = { side, type: ch.toUpperCase() };
    }
    b.hash = computeHash(b);
    return b;
  }
  const inPalace = (x, y, side) => {
    if (x < 3 || x > 5) return false;
    return side === RED ? (y >= 7 && y <= 9) : (y >= 0 && y <= 2);
  };
  const crossedRiver = (y, side) => side === RED ? y <= 4 : y >= 5;

  function genMoves(board, side) {
    const moves = [];
    const add = (fx, fy, tx, ty) => moves.push({ fx, fy, tx, ty });
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const p = board[y * W + x];
      if (!p || p.side !== side) continue;
      const t = p.type;
      if (t === "K") {
        const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for (const [dx, dy] of dirs) {
          const nx = x + dx, ny = y + dy;
          if (!inPalace(nx, ny, side)) continue;
          const q = board[ny * W + nx];
          if (!q || q.side !== side) add(x, y, nx, ny);
        }
      } else if (t === "A") {
        for (const [dx, dy] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
          const nx = x + dx, ny = y + dy;
          if (!inPalace(nx, ny, side)) continue;
          const q = board[ny * W + nx];
          if (!q || q.side !== side) add(x, y, nx, ny);
        }
      } else if (t === "B") {
        for (const [dx, dy] of [[2,2],[2,-2],[-2,2],[-2,-2]]) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
          if (side === RED ? ny < 5 : ny > 4) continue; // 象不过河
          const ex = x + dx / 2, ey = y + dy / 2;
          if (board[ey * W + ex]) continue; // 塞象眼
          const q = board[ny * W + nx];
          if (!q || q.side !== side) add(x, y, nx, ny);
        }
      } else if (t === "N") {
        const cand = [
          [1,2,0,1],[-1,2,0,1],[1,-2,0,-1],[-1,-2,0,-1],
          [2,1,1,0],[2,-1,1,0],[-2,1,-1,0],[-2,-1,-1,0]
        ];
        for (const [dx, dy, lx, ly] of cand) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
          if (board[(y + ly) * W + (x + lx)]) continue; // 蹩马腿
          const q = board[ny * W + nx];
          if (!q || q.side !== side) add(x, y, nx, ny);
        }
      } else if (t === "R") {
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          let nx = x + dx, ny = y + dy;
          while (nx >= 0 && nx < W && ny >= 0 && ny < H) {
            const q = board[ny * W + nx];
            if (!q) add(x, y, nx, ny);
            else { if (q.side !== side) add(x, y, nx, ny); break; }
            nx += dx; ny += dy;
          }
        }
      } else if (t === "C") {
        for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          let nx = x + dx, ny = y + dy, screen = false;
          while (nx >= 0 && nx < W && ny >= 0 && ny < H) {
            const q = board[ny * W + nx];
            if (!screen) {
              if (!q) add(x, y, nx, ny);
              else screen = true;
            } else {
              if (q) { if (q.side !== side) add(x, y, nx, ny); break; }
            }
            nx += dx; ny += dy;
          }
        }
      } else if (t === "P") {
        const fy = side === RED ? -1 : 1;
        let nx = x, ny = y + fy;
        if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
          const q = board[ny * W + nx];
          if (!q || q.side !== side) add(x, y, nx, ny);
        }
        if (crossedRiver(y, side)) {
          for (const dx of [-1, 1]) {
            const tx = x + dx;
            if (tx < 0 || tx >= W) continue;
            const q = board[y * W + tx];
            if (!q || q.side !== side) add(x, y, tx, y);
          }
        }
      }
    }
    return moves;
  }

  function findKing(board, side) {
    for (let i = 0; i < 90; i++) {
      const p = board[i];
      if (p && p.type === "K" && p.side === side) return i;
    }
    return -1;
  }

  // 将帅照面
  function kingsFacing(board) {
    let rk = -1, bk = -1;
    for (let i = 0; i < 90; i++) {
      const p = board[i];
      if (!p || p.type !== "K") continue;
      if (p.side === RED) rk = i; else bk = i;
    }
    if (rk < 0 || bk < 0) return false;
    if (rk % W !== bk % W) return false;
    const x = rk % W, y1 = Math.floor(rk / W), y2 = Math.floor(bk / W);
    const lo = Math.min(y1, y2), hi = Math.max(y1, y2);
    for (let y = lo + 1; y < hi; y++) if (board[y * W + x]) return false;
    return true;
  }

  function attacked(board, sq, bySide) {
    const x = sq % W, y = Math.floor(sq / W);
    // 车/炮/将帅直线
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      let nx = x + dx, ny = y + dy, screen = 0;
      while (nx >= 0 && nx < W && ny >= 0 && ny < H) {
        const q = board[ny * W + nx];
        if (q) {
          if (screen === 0) {
            if (q.side === bySide && (q.type === "R" || (q.type === "K" && Math.abs(dx) + Math.abs(dy) === 1))) return true;
            screen = 1;
          } else {
            if (q.side === bySide && q.type === "C") return true;
            break;
          }
        }
        nx += dx; ny += dy;
      }
    }
    // 马
    const kn = [[1,2,0,1],[-1,2,0,1],[1,-2,0,-1],[-1,-2,0,-1],[2,1,1,0],[2,-1,1,0],[-2,1,-1,0],[-2,-1,-1,0]];
    for (const [dx, dy] of kn) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
      const q = board[ny * W + nx];
      if (q && q.side === bySide && q.type === "N") {
        // 反推马腿：马在 (nx,ny)，目标 (x,y)
        const lx = nx - dx / 2 * 0, ly = 0;
        const legX = nx - (Math.abs(dx) === 2 ? dx / 2 : 0);
        const legY = ny - (Math.abs(dy) === 2 ? dy / 2 : 0);
        if (!board[legY * W + legX]) return true;
      }
    }
    // 兵/卒
    const pf = bySide === RED ? 1 : -1; // 兵的来向
    const pawnSquares = [[x, y + pf]];
    if (bySide === RED ? y <= 4 : y >= 5) { pawnSquares.push([x - 1, y], [x + 1, y]); }
    for (const [px, py] of pawnSquares) {
      if (px < 0 || px >= W || py < 0 || py >= H) continue;
      const q = board[py * W + px];
      if (q && q.side === bySide && q.type === "P") return true;
    }
    return false;
  }

  function inCheck(board, side) {
    const k = findKing(board, side);
    if (k < 0) return true;
    if (kingsFacing(board)) return true;
    return attacked(board, k, side === RED ? BLACK : RED);
  }

  function apply(board, m) {
    const cap = board[m.ty * W + m.tx];
    const p = board[m.fy * W + m.fx];
    let h = board.hash;
    if (h !== undefined) {
      h ^= ZOB[pieceIdx(p) * 90 + (m.fy * W + m.fx)];
      h ^= ZOB[pieceIdx(p) * 90 + (m.ty * W + m.tx)];
      if (cap) h ^= ZOB[pieceIdx(cap) * 90 + (m.ty * W + m.tx)];
    }
    board[m.ty * W + m.tx] = p;
    board[m.fy * W + m.fx] = null;
    if (h !== undefined) board.hash = h;
    return cap;
  }
  function undo(board, m, cap) {
    const p = board[m.ty * W + m.tx];
    let h = board.hash;
    if (h !== undefined) {
      h ^= ZOB[pieceIdx(p) * 90 + (m.ty * W + m.tx)];
      h ^= ZOB[pieceIdx(p) * 90 + (m.fy * W + m.fx)];
      if (cap) h ^= ZOB[pieceIdx(cap) * 90 + (m.ty * W + m.tx)];
    }
    board[m.fy * W + m.fx] = p;
    board[m.ty * W + m.tx] = cap;
    if (h !== undefined) board.hash = h;
  }

  function legalMoves(board, side) {
    const out = [];
    for (const m of genMoves(board, side)) {
      const cap = apply(board, m);
      const bad = inCheck(board, side);
      undo(board, m, cap);
      if (!bad) out.push(m);
    }
    return out;
  }

  const VAL = { K: 10000, R: 900, C: 450, N: 400, B: 200, A: 200, P: 100 };
  // 位置分权重：0 = 原版，1 = 程序化位置表（默认启用）
  let PST_W = 1;
  function setPstWeight(w) { PST_W = w; }
  function pst(type, i, side) {
    const y = Math.floor(i / 9), x = i % 9;
    const yy = side === RED ? y : 9 - y;
    let s = 0;
    if (type === "N") {
      if (x >= 2 && x <= 6 && yy >= 2 && yy <= 7) s += 15;
      if (x === 0 || x === 8) s -= 15;
      if (yy === 0 || yy === 9) s -= 10;
    } else if (type === "C") {
      if (x === 4) s += 12;
      if (yy === 2 || yy === 7) s += 8;
    } else if (type === "R") {
      if (x === 3 || x === 5) s += 10;
      if (yy >= 4 && yy <= 5) s += 8;
    } else if (type === "P") {
      const crossed = side === RED ? y <= 4 : y >= 5;
      if (crossed) s += 10 + (side === RED ? 4 - y : y - 5) * 6;
      if (x >= 3 && x <= 5) s += 5;
    } else if (type === "A" || type === "B") {
      if (yy === 9 || yy === 8) s += 8;
    } else if (type === "K") {
      if (yy === 9) s += 8;
    }
    return s;
  }
  let SAFE_W = 0;
  function setSafeWeight(w) { SAFE_W = w; }
  function kingSafety(board, side) {
    const k = findKing(board, side);
    if (k < 0) return -10000;
    let s = 0;
    let adv = 0, ele = 0;
    for (let i = 0; i < 90; i++) {
      const p = board[i];
      if (!p || p.side !== side) continue;
      if (p.type === "A") adv++;
      else if (p.type === "B") ele++;
    }
    s -= (2 - adv) * 25;
    s -= (2 - ele) * 18;
    const x = k % 9, y = Math.floor(k / 9);
    const opp = side === RED ? BLACK : RED;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      let nx = x + dx, ny = y + dy, screen = 0;
      while (nx >= 0 && nx < 9 && ny >= 0 && ny < 10) {
        const q = board[ny * 9 + nx];
        if (q) {
          if (q.side === opp) {
            if (screen === 0 && q.type === "R") { s -= 40; break; }
            if (screen === 1 && q.type === "C") { s -= 35; break; }
          }
          screen++;
        }
        nx += dx; ny += dy;
      }
    }
    return s;
  }
  function evaluate(board, side) {
    let material = 0;
    for (let i = 0; i < 90; i++) {
      const p = board[i];
      if (p && p.type !== "K") material += VAL[p.type];
    }
    const opening = material > 8000;
    const midgame = material > 5000;
    const pawnBase = opening ? 70 : midgame ? 90 : 120;
    let s = 0;
    for (let i = 0; i < 90; i++) {
      const p = board[i];
      if (!p) continue;
      let v = (p.type === "P" ? pawnBase : VAL[p.type]) + PST_W * pst(p.type, i, p.side);
      if (p.type === "P") {
        const y = Math.floor(i / W);
        const crossed = p.side === RED ? y <= 4 : y >= 5;
        if (crossed) v += 100;
        v += (p.side === RED ? (9 - y) : y) * 5;
      }
      if (p.type === "N" || p.type === "C") v += 10;
      if (opening) {
        if (p.type === "R") {
          const home = p.side === RED ? (i === 81 || i === 89) : (i === 0 || i === 8);
          if (home) v -= 50;
        } else if (p.type === "N") {
          const home = p.side === RED ? (i === 82 || i === 88) : (i === 1 || i === 7);
          if (home) v -= 40;
        }
      }
      s += p.side === side ? v : -v;
    }
    return s + SAFE_W * (kingSafety(board, side) - kingSafety(board, side === RED ? BLACK : RED));
  }
  // Zobrist hash + 置换表
  const ZOB = new Int32Array(14 * 90);

  function bookMove(board, side) {
    const list = BOOK[X.keyOf(board, side)];
    if (!list || !list.length) return null;
    const s = list[Math.floor(Math.random() * list.length)];
    const p = s.split(",").map(Number);
    return { fx: p[0], fy: p[1], tx: p[2], ty: p[3] };
  }
  const TIME = { 2: 200, 3: 600, 4: 1500, 5: 2500, 6: 4000 };
  const state = { board: X.newBoard(), turn: X.RED, mode: "ai", depth: 3,
                  selected: null, legal: [], history: [], log: [], over: false, posCount: new Map(), posKeys: [],
                  lastMove: null, stepScores: [], stepDetails: [], scoreQueue: [], bookOn: false };

  function drawLines() {
    const NS = "http://www.w3.org/2000/svg";
    const mk = (tag, attrs) => {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      svg.appendChild(e);
      return e;
    };
    const x0 = px(0), x1 = px(8), y0 = py(0), y1 = py(9);
    for (let i = 0; i < 10; i++) mk("line", { x1: x0, y1: py(i), x2: x1, y2: py(i), stroke: "#7a5230", "stroke-width": 1.5 });
    for (let j = 0; j < 9; j++) {
      if (j === 0 || j === 8) {
        mk("line", { x1: px(j), y1: y0, x2: px(j), y2: y1, stroke: "#7a5230", "stroke-width": 1.5 });
      } else {
        mk("line", { x1: px(j), y1: y0, x2: px(j), y2: py(4), stroke: "#7a5230", "stroke-width": 1.5 });
        mk("line", { x1: px(j), y1: py(5), x2: px(j), y2: y1, stroke: "#7a5230", "stroke-width": 1.5 });
      }
    }
    mk("line", { x1: px(3), y1: py(0), x2: px(5), y2: py(2), stroke: "#7a5230", "stroke-width": 1.2 });
    mk("line", { x1: px(5), y1: py(0), x2: px(3), y2: py(2), stroke: "#7a5230", "stroke-width": 1.2 });
    mk("line", { x1: px(3), y1: py(7), x2: px(5), y2: py(9), stroke: "#7a5230", "stroke-width": 1.2 });
    mk("line", { x1: px(5), y1: py(7), x2: px(3), y2: py(9), stroke: "#7a5230", "stroke-width": 1.2 });
    mk("rect", { x: x0 - 16, y: y0 - 16, width: x1 - x0 + 32, height: y1 - y0 + 32,
                 fill: "none", stroke: "#5b3a1e", "stroke-width": 4 });
    const mkText = (txt, cx, cy) => {

  function updateEvalBar() {
    const ev = X.evaluate(state.board, X.RED);
    const clamped = Math.max(-800, Math.min(800, ev));
    const red = document.getElementById("evalBarRed");
    if (red) red.style.width = (50 + clamped / 16) + "%";
    const label = document.getElementById("evalBarLabel");
    if (label) {
      const abs = Math.abs(ev);
      if (abs < 50) label.textContent = "均势";
      else {
        const side = ev > 0 ? "红" : "黑";
        const tag = abs >= 400 ? "胜势" : abs >= 150 ? "优势" : "略优";
        label.textContent = side + " +" + (abs / 100).toFixed(1) + " " + tag;
      }
    }
  }
  function render() {
    updateEvalBar();
    piecesEl.innerHTML = "";
    marksEl.innerHTML = "";
    const lm = state.lastMove;
    if (lm) {
      const x1 = px(lm.fx), y1 = py(lm.fy), x2 = px(lm.tx), y2 = py(lm.ty);
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      const trail = document.createElement("div");
      trail.className = "trail";
      trail.style.left = x1 + "px";
      trail.style.top = (y1 - 3) + "px";
      trail.style.width = len + "px";
      trail.style.transform = "rotate(" + ang + "deg)";
      marksEl.appendChild(trail);

      const fm = document.createElement("div");
      fm.className = "from-mark";
      fm.style.left = px(lm.fx) + "px"; fm.style.top = py(lm.fy) + "px";
      marksEl.appendChild(fm);

      const tm = document.createElement("div");
      tm.className = "to-mark";
      tm.style.left = px(lm.tx) + "px"; tm.style.top = py(lm.ty) + "px";
      marksEl.appendChild(tm);

    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const p = state.board[y * W + x];
      if (!p) continue;
      const d = document.createElement("div");
      d.className = "piece " + p.side;
      d.style.left = px(x) + "px";
      d.style.top = py(y) + "px";
      d.textContent = X.CH[p.side][p.type];
      if (state.selected && state.selected.x === x && state.selected.y === y) d.classList.add("sel");
      if (lm && lm.tx === x && lm.ty === y) d.classList.add("moved");
      piecesEl.appendChild(d);
    }
    for (const m of state.legal) {
      const cap = state.board[m.ty * W + m.tx];
      const d = document.createElement("div");
      d.className = cap ? "ring" : "dot";
      d.style.left = px(m.tx) + "px";
      d.style.top = py(m.ty) + "px";
      marksEl.appendChild(d);
    }
    renderThreat();
    renderSafety();
    renderMaterial();
    updateStatus();
  }

  function renderThreat() {
    const lm = state.lastMove;
    if (!lm || state.over) return;
    const mover = state.board[lm.ty * W + lm.tx];
    if (!mover) { el.textContent = ""; return; }
    const enemy = mover.side;
    const mySide = enemy === X.RED ? X.BLACK : X.RED;
    if (state.turn !== mySide) return;
    const moves = X.legalMoves(state.board, enemy).filter(m => m.fx === lm.tx && m.fy === lm.ty);
    const targets = [];
    for (const m of moves) {
      const q = state.board[m.ty * W + m.tx];
      if (q && q.side === mySide) targets.push({ x: m.tx, y: m.ty, q: q });
    }
    for (const t of targets) {
      const d = document.createElement("div");
      d.className = "safety-mark threat-mark";
      d.style.left = px(t.x) + "px";
      d.style.top = py(t.y) + "px";
      marksEl.appendChild(d);
    }
  }

  function renderSafety() {
    if (state.over) return;
    const side = state.mode === "ai" ? X.RED : state.turn;
    const opp = side === X.RED ? X.BLACK : X.RED;
    const oppMoves = X.legalMoves(state.board, opp);
    const danger = [], warn = [];
    for (let sq = 0; sq < 90; sq++) {
      const p = state.board[sq];
      if (!p || p.side !== side || p.type === "K") continue;
      const x = sq % W, y = Math.floor(sq / W);
      let minVal = Infinity, minType = null;
      for (const m of oppMoves) {
        if (m.tx !== x || m.ty !== y) continue;
        const a = state.board[m.fy * W + m.fx];
        if (!a) continue;
        const v = X.VAL[a.type];
        if (v < minVal) { minVal = v; minType = a.type; }
      }
      if (!minType) continue;
      const myVal = X.VAL[p.type];
      const hasRoot = X.attacked(state.board, sq, side);
      const name = X.CH[side][p.type], att = X.CH[opp][minType];
      let mark = null;
      if (!hasRoot && minVal <= myVal) {
        mark = "safety-danger";
        danger.push(name + "无根，会被" + att + "吃");
      } else if (hasRoot && minVal < myVal) {
        mark = "safety-warn";
        warn.push(name + "被" + att + "攻击");
      }
      if (mark) {
        const d = document.createElement("div");
        d.className = "safety-mark " + mark;
        d.style.left = px(x) + "px";
        d.style.top = py(y) + "px";
        marksEl.appendChild(d);
      }
    }
  }

  function renderMaterial() {
    const el = document.getElementById("materialHint");
    if (!el) return;
    if (state.over) { el.textContent = ""; return; }
    const cnt = { r: {}, b: {} };
    for (const side of ["r", "b"]) for (const t of ["R", "N", "C", "A", "B", "P"]) cnt[side][t] = 0;
    for (let i = 0; i < 90; i++) {
      const p = state.board[i];
      if (p && p.type !== "K") cnt[p.side][p.type]++;
    }
    const namesR = { R: "车", N: "马", C: "炮", A: "仕", B: "相", P: "兵" };
    const namesB = { R: "车", N: "马", C: "炮", A: "士", B: "象", P: "卒" };
    const order = ["R", "N", "C", "A", "B", "P"];
    const redParts = [], blackParts = [];
    for (const t of order) {
      const d = cnt.r[t] - cnt.b[t];
      if (d > 0) redParts.push("红 " + d + namesR[t]);
      else if (d < 0) blackParts.push("黑 " + (-d) + namesB[t]);
    }
    if (!redParts.length && !blackParts.length) { el.textContent = "子力均势"; return; }
    let html = "子力领先：";
    if (redParts.length) html += '<span class="mat-red">' + redParts.join(" · ") + "</span>";
    if (redParts.length && blackParts.length) html += "　";
    if (blackParts.length) html += '<span class="mat-black">' + blackParts.join(" · ") + "</span>";
    el.innerHTML = html;
  }

  function updateStatus() {
    if (state.over) return;
    const side = state.turn;
    const moves = X.legalMoves(state.board, side);
    if (!moves.length) {
      state.over = true;
      statusEl.innerHTML = "<b>" + (side === X.RED ? "黑方" : "红方") + "胜</b>（" + NAME[side] + "方无棋可走）";
      return;
    }
    let t = NAME[side] + "方走棋";
    if (X.inCheck(state.board, side)) t += " · <b>被将军！</b>";
    statusEl.innerHTML = t;
  }

  function pick(ev) {
    const r = boardEl.getBoundingClientRect();
    const k = 544 / r.width;                 // 缩放还原系数（未缩放时为 1）
    const mx = (ev.clientX - r.left) * k - MX, my = (ev.clientY - r.top) * k - MY;
    const x = Math.round(mx / CELL), y = Math.round(my / CELL);
    if (x < 0 || x > 8 || y < 0 || y > 9) return null;
    if (Math.abs(mx - x * CELL) > 26 || Math.abs(my - y * CELL) > 26) return null;
    return { x, y };
  }

  function onClick(ev) {
    if (state.over) return;
    const pos = pick(ev);
    if (!pos) return;
    const side = state.turn;
    if (state.mode === "ai" && side !== X.RED) return;
    const p = state.board[pos.y * W + pos.x];
    if (state.selected) {
      const mv = state.legal.find(m => m.tx === pos.x && m.ty === pos.y);
      if (mv) { doMove(mv); return; }
      if (p && p.side === side) { select(pos.x, pos.y); return; }
      state.selected = null; state.legal = []; render(); return;
    }
    if (p && p.side === side) select(pos.x, pos.y);
  }

  function select(x, y) {
    state.selected = { x, y };
    state.legal = X.legalMoves(state.board, state.turn).filter(m => m.fx === x && m.fy === y);
    render();
  }

  function doMove(m) {
    const mover = state.board[m.fy * W + m.fx];
    const notation = notate(state.board, m, mover);
    const beforeBoard = state.board.slice();
    const cap = X.apply(state.board, m);
    const afterBoard = state.board.slice();
    state.history.push({ m, cap });
    state.lastMove = { fx: m.fx, fy: m.fy, tx: m.tx, ty: m.ty, side: mover.side, type: mover.type,
                       cap: cap ? cap.type : null, capSide: cap ? cap.side : null, notation };
    state.log.push(state.log.length + 1 + ". " + NAME[mover.side] + " " + notation +
      (cap ? " 吃" + X.CH[cap.side][cap.type] : ""));
    state.stepScores.push(null);
    state.stepDetails.push(null);
    renderLog();
    state.selected = null; state.legal = [];
    state.turn = state.turn === X.RED ? X.BLACK : X.RED;
    const gaveCheck = X.inCheck(state.board, mover.side === X.RED ? X.BLACK : X.RED);
    const capInfo = cap ? { type: cap.type, side: cap.side } : null;
    // 人机模式只点评玩家（红方）的走法，电脑走子不占分析预算
    const analyzeThisMove = state.mode !== "ai" || mover.side === X.RED;
    if (analyzeThisMove) {
      state.scoreQueue.push({ idx: state.history.length - 1, beforeBoard: beforeBoard, afterBoard: afterBoard,
                              side: mover.side, capInfo: capInfo, gaveCheck: gaveCheck });
      if (!state.over) setTimeout(pumpScores, 300);
    }
    const key = X.keyOf(state.board, state.turn);
    state.posKeys.push(key);
    const rep = (state.posCount.get(key) || 0) + 1;
    state.posCount.set(key, rep);
    if (rep >= 3) {
      state.over = true;
      if (X.inCheck(state.board, state.turn)) {
        const winner = state.turn === X.RED ? "黑方" : "红方";
        statusEl.innerHTML = "<b>" + winner + "长将，判负</b>";
      } else {
        statusEl.innerHTML = "<b>三次重复局面，判和（重复违规）</b>";
      }
    }
    render();
    if (!state.over && state.mode === "ai" && state.turn === X.BLACK) {
      statusEl.innerHTML = "电脑思考中…";
      setTimeout(() => {
        const useBook = true;
        const bm = useBook ? bookMove(state.board, X.BLACK) : null;
        if (bm) { doMove(bm); return; }
        const mv = pickAiMove();
        if (mv) doMove(mv); else updateStatus();
      }, 120);
    }
  }
  function undo() {
    if (!state.history.length) return;
    const times = state.mode === "ai" ? (state.turn === X.RED ? 2 : 1) : 1;
    for (let k = 0; k < times && state.history.length; k++) {
      const h = state.history.pop();
      X.undo(state.board, h.m, h.cap);
      state.turn = state.turn === X.RED ? X.BLACK : X.RED;
      state.log.pop();
      state.stepScores.pop();
      state.stepDetails.pop();
      state.scoreQueue = [];
    }
    state.over = false; state.selected = null; state.legal = []; state.lastMove = null;
    state.posKeys.splice(Math.max(0, state.posKeys.length - times), times);
    state.posCount = new Map();
    for (const k of state.posKeys) state.posCount.set(k, (state.posCount.get(k) || 0) + 1);
    renderLog();
    render();
  }

  function reset() {
    state.board = X.newBoard(); state.turn = X.RED;
    state.selected = null; state.legal = []; state.history = []; state.log = []; state.stepScores = []; state.stepDetails = []; state.scoreQueue = []; state.over = false;
    state.lastMove = null;
    state.posCount = new Map(); state.posKeys = [];
    logEl.textContent = "（棋谱会显示在这里）";
    render();
  }

  boardEl.addEventListener("click", onClick);

  // 窄屏自适应：整个棋盘等比缩放，点击坐标按比例还原
  function fitScreen() {
    const vw = document.documentElement.clientWidth;
    const s = Math.min(1, (vw - 24) / 544);
    document.documentElement.style.setProperty("--bs", s.toFixed(4));
  }
  fitScreen();
  window.addEventListener("resize", fitScreen);
  window.addEventListener("orientationchange", () => setTimeout(fitScreen, 120));

  document.getElementById("btnNew").onclick = reset;
  document.getElementById("btnUndo").onclick = undo;
  document.getElementById("mode").onchange = e => { state.mode = e.target.value; reset(); };
  document.getElementById("depth").onchange = e => { state.depth = +e.target.value; };
  document.getElementById("btnCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(state.log.join("\n")); statusEl.innerHTML = "棋谱已复制"; }
    catch (e) { statusEl.innerHTML = "复制失败，请手动选择文本"; }
  };

  document.getElementById("btnSave").onclick = async () => {
    const fen = X.fenOf(state.board, state.turn);
    logEl.textContent = state.log.join("\n") + "\n\n[当前局面 FEN]\n" + fen;
    logEl.scrollTop = logEl.scrollHeight;
    try { await navigator.clipboard.writeText(fen); statusEl.innerHTML = "FEN 已复制"; }
    catch (e) { statusEl.innerHTML = "复制失败，FEN 已显示在下方"; }
  };

  // 载入：FEN 局面 / 中文记谱
  function applySteps(entries) {
    reset();
    let side = X.RED, ok = true, n = 0;
    for (const e of entries) {
      let m = null;
      if (e.name) {
        m = X.legalMoves(state.board, side).find(mm => {
          const p = state.board[mm.fy * 9 + mm.fx];
          return p && notate(state.board, mm, p) === e.name;
        });
      } else if (X.legalMoves(state.board, side).some(mm => mm.fx === e.fx && mm.fy === e.fy && mm.tx === e.tx && mm.ty === e.ty)) {
        m = { fx: e.fx, fy: e.fy, tx: e.tx, ty: e.ty };
      }
      if (!m) { ok = false; break; }
      const mover = state.board[m.fy * 9 + m.fx];
      const notation = notate(state.board, m, mover);
      const cap = X.apply(state.board, m);
      state.history.push({ m, cap });
      state.log.push(state.log.length + 1 + ". " + NAME[side] + " " + notation + (cap ? " 吃" + X.CH[cap.side][cap.type] : ""));
      state.stepScores.push(null);
      state.stepDetails.push(null);
      side = side === X.RED ? X.BLACK : X.RED;
      const key = X.keyOf(state.board, side);
      state.posKeys.push(key);
      state.posCount.set(key, (state.posCount.get(key) || 0) + 1);
      n++;
    }
    state.turn = side;
    renderLog();
    render();
    statusEl.innerHTML = ok ? "棋谱已载入（" + n + " 步），轮到" + NAME[side] + "方" : "第 " + (n + 1) + " 步不合法，已载入前 " + n + " 步";
    if (ok && state.mode === "ai" && state.turn === X.BLACK && !state.over) aiReply();
  }

  function analyzeRepeat(board, side, m) {
    const cap = X.apply(board, m);
    const next = side === X.RED ? X.BLACK : X.RED;
    const key = X.keyOf(board, next);
    const cnt = state.posKeys.filter(k => k === key).length;
    const check = X.inCheck(board, next);
    X.undo(board, m, cap);
    return { cnt: cnt, check: check, bad: cnt >= 2 || (check && cnt >= 1) };
  }

  function pickAiMove() {
    const side = X.BLACK;
    const mv = X.bestMove(state.board, side, state.depth, TIME[state.depth] || 1500, state.posKeys);
    if (!mv) return null;
    if (!analyzeRepeat(state.board, side, mv).bad) return mv;
    const alts = X.legalMoves(state.board, side).filter(m => !analyzeRepeat(state.board, side, m).bad);
    if (!alts.length) return mv;
    let best = null, bestScore = -Infinity;
    for (const m of alts) {
      const cap = X.apply(state.board, m);
      const score = X.evaluate(state.board, side);
      X.undo(state.board, m, cap);
      if (score > bestScore) { bestScore = score; best = m; }
    }
    return best || mv;
  }

  function aiReply() {
    setTimeout(() => {
      const bm = bookMove(state.board, X.BLACK);
      if (bm) { doMove(bm); return; }
      const mv = pickAiMove();
      if (mv) doMove(mv); else updateStatus();
    }, 250);
  }

  function loadFen(txt) {
    const parsed = X.parseFen(txt);
    if (!parsed) { statusEl.innerHTML = "FEN 解析失败"; return; }
    reset();
    state.board = parsed.board;
    state.turn = parsed.side;
    state.posKeys = [X.keyOf(state.board, state.turn)];
    state.posCount = new Map([[state.posKeys[0], 1]]);
    render();
    statusEl.innerHTML = "FEN 已载入，轮到" + NAME[state.turn] + "方";
    if (state.mode === "ai" && state.turn === X.BLACK && !state.over) aiReply();
  }

  document.getElementById("btnLoad").onclick = () => {
    const raw = prompt("粘贴棋谱：FEN 局面 / 中文记谱");
    if (!raw) return;
    const txt = raw.trim();
    if (txt.includes("/")) { loadFen(txt); return; }
    // 中文记谱：去掉序号、红/黑前缀和「吃X」后缀
    const names = txt
      .replace(/\d+\s*[.、]\s*/g, " ")
      .replace(/[红黑]\s*/g, " ")
      .replace(/吃[车马炮卒兵仕相士帅将象]/g, " ")
      .split(/[\s;；,，]+/)
      .map(t => t.trim())
      .filter(Boolean);
    if (!names.length) { statusEl.innerHTML = "没有识别到棋谱"; return; }
    applySteps(names.map(name => ({ name })));
  };

  drawLines();
  render();
})();
</script>


<script>
(function () {
  var lastTouch = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - lastTouch < 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
